name: Probe versions
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Versions
        run: |
          echo "== AGP8"; curl -s https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -E "<version>8\.1[0-9]" | tail -8 | tr -d ' \n'; echo
          echo "== KGP"; curl -s https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml | grep -E "<version>2\.[345]\.[0-9]+</version>" | tail -8 | tr -d ' \n'; echo
          echo "== Gradle8"; curl -s https://services.gradle.org/versions/all | grep -E '"version" : "8\.1[0-9]' | grep -v -E "rc|milestone|snapshot" | tr -d ' \n'; echo
